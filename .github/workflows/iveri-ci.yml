name: IVERI AI Agent — Sovereign CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # 1. Linux Air-Gap & Diagnostics Verification
  # -------------------------------------------------------------------
  verify-linux:
    name: Verify Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf python-docx openpyxl fastapi uvicorn pydantic rich httpx

      - name: Verify Cryptographic Checksums
        run: |
          python scripts/verify_checksums.py

      - name: Run Sovereign Readiness Doctor
        run: |
          python scripts/iveri_doctor.py

  # -------------------------------------------------------------------
  # 2. Windows Native & Launcher Verification
  # -------------------------------------------------------------------
  verify-windows:
    name: Verify Windows Native
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf python-docx openpyxl fastapi uvicorn pydantic rich httpx

      - name: Verify Cryptographic Checksums
        run: |
          python scripts/verify_checksums.py

      - name: Run Sovereign Readiness Doctor (Python)
        run: |
          python scripts\iveri_doctor.py

      - name: Test PowerShell Sovereign Launcher
        shell: pwsh
        run: |
          .\iveri.ps1 doctor
